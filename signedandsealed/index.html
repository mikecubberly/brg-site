<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Signed &amp; Sealed | Bottle Rocket Growth</title>
<meta name="description" content="Signed & Sealed by Bottle Rocket Growth. A private agreement workspace for sending, signing, tracking, and storing contracts.">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://bottlerocketgrowth.com/signedandsealed">
<link rel="preconnect" href="https://clients.bottlerocketgrowth.com">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#86c6d1}
body{overflow:hidden}
.signedandsealed-frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#86c6d1}
.brg-built-footer{position:fixed;left:50%;bottom:12px;z-index:5;transform:translateX(-50%);min-width:190px;padding:6px 12px 8px;border-radius:999px;background:rgba(255,255,255,.34);border:1px solid rgba(255,255,255,.38);backdrop-filter:blur(12px);color:rgba(18,48,66,.74);display:flex;gap:8px;align-items:center;justify-content:center;font:800 12px/1.1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;box-shadow:0 10px 28px -22px rgba(18,48,66,.62);pointer-events:none}
.brg-built-footer img{width:24px;height:24px;object-fit:contain;opacity:.92}
.fallback{position:fixed;inset:auto 18px 18px 18px;z-index:2;display:none;justify-content:center;font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#142b3a}
.fallback a{color:#142b3a;font-weight:700}
@media(max-width:640px){.fallback{font-size:12px}.brg-built-footer{bottom:10px;min-width:0;font-size:11px}.brg-built-footer img{width:21px;height:21px}}
</style>
</head>
<body>
<iframe class="signedandsealed-frame" id="signedandsealed-frame" title="Signed & Sealed"></iframe>
<div class="brg-built-footer" aria-label="Built by Bottle Rocket Growth">
  <img src="/brg-logo-mark.png" alt="">
  <span>Built by Bottle Rocket Growth</span>
</div>
<div class="fallback" id="fallback">
  <span>Having trouble loading Signed &amp; Sealed? <a id="direct-link" href="/signedandsealed/">Reload the tool</a>.</span>
</div>
<script>
(function(){
  var frame = document.getElementById('signedandsealed-frame');
  var direct = document.getElementById('direct-link');
  var fallback = document.getElementById('fallback');
  var query = window.location.search || '';
  var separator = query ? '&' : '?';
  var target = 'https://clients.bottlerocketgrowth.com/signedandsealed.html' + query + separator + 'v=9e3b25b';
  var loaded = false;
  frame.addEventListener('load', function(){
    loaded = true;
    fallback.style.display = 'none';
  });
  frame.src = target;
  direct.href = '/signedandsealed/' + query;
  window.setTimeout(function(){
    if (!loaded) fallback.style.display = 'flex';
  }, 6000);
})();
</script>
</body>
</html>
